name: Assemble tested KLANS source

on:
  push:
    branches:
      - agent/klans-solo-playtest
    paths:
      - .github/workflows/assemble-source.yml

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify source archive
        shell: bash
        run: |
          cat .agent-parts/src.* | base64 --decode > /tmp/klans-src.tar.gz
          printf '%s  %s\n' '1379e3c41a76cc7cd570963018d7a0fe3000786679c636eb00b1d9a92cf2b35a' '/tmp/klans-src.tar.gz' | sha256sum --check --strict
          tar -xzf /tmp/klans-src.tar.gz -C .
          rm -rf .agent-parts
          rm -f .github/workflows/assemble-source.yml

      - name: Commit finished project
        shell: bash
        run: |
          git config user.name 'KLANS AI Agent'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Build KLANS solo playtest'
          git push origin HEAD:agent/klans-solo-playtest
