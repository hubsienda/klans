name: Assemble simplified KLANS

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  assemble:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/klans-simplified-rules'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Verify and unpack tested source
        shell: bash
        run: |
          cat .klans-build/part-* > /tmp/klans-src.b64
          base64 --decode /tmp/klans-src.b64 > /tmp/klans-src.tgz
          echo "b35b1c00f8a5fd01deecd31a7ef6ed53f1797e2aae406b464ef8f88dcf825882  /tmp/klans-src.tgz" | sha256sum --check --strict
          tar -xzf /tmp/klans-src.tgz -C .
          rm -rf .klans-build .github/workflows/assemble-simplified.yml

      - name: Commit rebuilt project
        shell: bash
        run: |
          git config user.name "KLANS Build Agent"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Rebuild KLANS with simplified solo rules"
          git push origin HEAD:${{ github.head_ref }}
